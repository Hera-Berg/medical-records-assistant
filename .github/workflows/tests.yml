# The test suite on every platform the app is built for, plus Linux.
#
# Until this workflow existed the suite had only ever run on Linux, and code for
# macOS and Windows was pinned, hash-checked and never executed. The
# dependencies are installed from the same hash-pinned lock the release build
# freezes, so what is tested is what ships.
#
# A test that hangs on one platform must fail there with a traceback, not sit
# until the job's time limit: see the pytest flags below.
#
# Actions are pinned by commit. A release pipeline for an unsigned binary is
# only as trustworthy as the code it runs, and a tag can be moved.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push supersedes an older run on the same branch. Without this a hung
# job keeps a runner for its whole time limit while the run that matters queues
# behind it. Deliberately not on the release workflow: a build that is producing
# something people will download is never cancelled from under itself.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the locked dependencies
        run: |
          python -m pip install --require-hashes -r packaging/requirements-app.txt
          python -m pip install --require-hashes -r packaging/requirements-test.txt
          python -m pip install --no-deps -e .
      # -v names each test as it starts, so a hang is attributable from the log;
      # --timeout turns one into a failure with a traceback instead of a job
      # that burns its 45 minutes and says nothing; -rf lists what failed at the
      # end, where it can be read without scrolling. The slowest test here takes
      # under four seconds on a developer machine.
      - name: Run the tests
        run: python -m pytest -v --timeout=120 -rf --junit-xml=ci-report.xml -o junit_logging=all --basetemp=pytest-tmp

      # Positively, by name: passed, failed, skipped or never collected. A
      # guarantee that quietly skipped itself on one platform reads exactly like
      # one that passed, and "not in the failure list" is not evidence.
      - name: Say what the invariant tests did
        if: always()
        continue-on-error: true
        run: python packaging/ci_invariants.py ci-report.xml

      # Annotations are readable without a token; run logs are not. Whoever
      # triages a failure on a platform they do not have should not have to be
      # handed the log first.
      - name: Say what failed, where it can be read without a token
        if: failure()
        run: python packaging/ci_annotations.py ci-report.xml

      # The reader writes why a launch failed to its own log, inside pytest's
      # temporary directory. Without this it is readable only by downloading the
      # job's log, which needs a credential the person triaging may not have.
      - name: Say what the reader's log says
        if: failure()
        run: python packaging/ci_reader_logs.py pytest-tmp
