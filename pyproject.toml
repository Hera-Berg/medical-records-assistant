[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-agent"
version = "0.1.0"
description = "Patient-held health record agent — vault, event log, ingest, projection, extraction"
requires-python = ">=3.11"
# httpx, for the one thing stdlib cannot do here: a short connect timeout with a
# long read timeout. Vision prefill on a large page can exceed a minute while a
# sleeping box must fail in seconds, and they are different problems.
# Pillow preprocesses images before they reach the model — see MODELS.md,
# "Image token budget", which is the most likely cause of an out-of-memory crash.
# FastAPI and uvicorn are the app, not an optional extra: `pip install -e .`
# followed by `health-agent serve` has to work on a machine with Python and
# nothing else. python-multipart is what FastAPI needs to accept a file upload,
# which is the whole of /api/capture.
# faster-whisper is here rather than an extra since phase 11: "install and it
# works" has to include voice notes. It brings PyAV, which is ffmpeg's own
# libraries and decodes recordings with nothing else installed.
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The deterministic half of dual-path extraction, and PDF page rendering at 150
# DPI (pdfplumber brings pypdfium2, which does both). Optional: without them the
# deterministic path reports itself unavailable and claims are `uncorroborated`
# rather than `cross-verified`. Never fatal — the VLM is the reader.
documents = ["pdfplumber>=0.11"]
ocr = ["pytesseract>=0.3"]
# The default credential store. Without it the env var and the credentials file
# still work; see MODELS.md, "Credentials".
keychain = ["keyring>=24"]
# Kept so `pip install 'health-agent[speech]'` from older instructions still
# resolves. Speech is a default dependency now.
speech = []

[project.scripts]
health-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

# The built interface ships inside the package. It is committed to the
# repository so that self-hosting needs Python and nothing else — a Vite build
# standing between `pip install` and a working app would put a node toolchain in
# the install story of a personal health record. Building it is a developer
# step; see frontend/README.md.
[tool.setuptools.package-data]
"agent.server" = ["static_files/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
